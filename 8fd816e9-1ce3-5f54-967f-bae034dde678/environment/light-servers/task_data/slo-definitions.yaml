# SLI definitions for registered SLOs (Reliability Office, rev 2026-09-01)
# Each SLO counts bad minutes on the SLI of record. Targets are NOT defined here (see the standard).
# metric: the platform metric the panels sum; unit: the unit that metric is emitted in.
slos:
  - service: ledger-posting
    domain: Ledger
    sli: availability
    rule: "a minute is bad when more than 1.0% of requests in it return 5xx or time out"
    metric: bwp.sli.bad_minutes
    unit: minute
    measured_on: production serving path (RS-2 section 3)
  - service: ledger-balance-read
    domain: Ledger
    sli: latency
    rule: "a minute is bad when its p99 request duration exceeds 300 ms"
    metric: bwp.sli.bad_minutes
    unit: minute
    measured_on: production serving path (RS-2 section 3)
  - service: journal-export
    domain: Ledger
    sli: availability
    rule: "a minute is bad when more than 1.0% of requests in it return 5xx or time out"
    metric: bwp.sli.bad_minutes
    unit: minute
    measured_on: production serving path (RS-2 section 3)
  - service: fx-rates-feed
    domain: Ledger
    sli: freshness
    rule: "a minute is bad when the newest published record is older than 90 seconds"
    metric: bwp.sli.bad_time
    unit: second
    measured_on: production serving path (RS-2 section 3)
